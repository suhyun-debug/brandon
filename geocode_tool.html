const logEl = document.getElementById('log');
const sP = document.getElementById('sP'), sS = document.getElementById('sS'), sF = document.getElementById('sF');
let cntS = 0, cntF = 0;

function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

async function geocode(addr, key) {
  // 1차: 주소 검색
  let r = await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}`, {
    headers: { Authorization: `KakaoAK ${key}` }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  let j = await r.json();
  if (j.documents && j.documents.length) {
    return { lat: parseFloat(j.documents[0].y), lng: parseFloat(j.documents[0].x), src: 'address' };
  }
  // 2차: 키워드 검색 (주소 검색 실패 시)
  r = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(addr)}`, {
    headers: { Authorization: `KakaoAK ${key}` }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  j = await r.json();
  if (j.documents && j.documents.length) {
    return { lat: parseFloat(j.documents[0].y), lng: parseFloat(j.documents[0].x), src: 'keyword' };
  }
  return null;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('runBtn').addEventListener('click', async () => {
  const key = document.getElementById('kakaoKey').value.trim();
  if (!key) { alert('API 키를 입력하세요'); return; }
  document.getElementById('runBtn').disabled = true;
  logEl.innerHTML = '';
  log(`▶ ${MATCHES.length}건 변환 시작`, 'info');

  for (let i = 0; i < MATCHES.length; i++) {
    const m = MATCHES[i];
    try {
      const r = await geocode(m.address, key);
      if (!r) {
        log(`[${i+1}/${MATCHES.length}] ✗ ${m.name}: 좌표 없음 (${m.address})`, 'err');
        cntF++;
      } else {
        await db.collection('partners').doc(m.id).update({ lat: r.lat, lng: r.lng });
        log(`[${i+1}/${MATCHES.length}] ✓ ${m.name}: ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)} (${r.src})`, 'ok');
        cntS++;
      }
    } catch (e) {
      log(`[${i+1}/${MATCHES.length}] ✗ ${m.name}: ${e.message}`, 'err');
      cntF++;
    }
    sS.textContent = cntS; sF.textContent = cntF;
    sP.textContent = MATCHES.length - cntS - cntF;
    await sleep(120);
  }
  log(`\n=== 완료: 성공 ${cntS} / 실패 ${cntF} ===`, 'info');
  document.getElementById('runBtn').disabled = false;
});
</script>
